name: Test and build Windows .exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Jython
        uses: actions/cache@v4
        with:
          path: ~/.cache/jython
          key: jython-2.7.3

      - name: Download Jython (runs the Fiji worker script against stubs)
        run: |
          mkdir -p ~/.cache/jython
          test -f ~/.cache/jython/jython.jar || curl -sSfL --retry 4 -o ~/.cache/jython/jython.jar \
            https://repo1.maven.org/maven2/org/python/jython-standalone/2.7.3/jython-standalone-2.7.3.jar
          echo "JYTHON_JAR=$HOME/.cache/jython/jython.jar" >> "$GITHUB_ENV"

      - name: Install package
        run: pip install -e ".[dev]" tifffile

      - name: Run tests
        run: xvfb-run -a pytest -v

  # The MATLAB worker script is exercised under GNU Octave. Installing Octave is
  # slow, so this runs alongside the build instead of gating it.
  test-matlab-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Octave
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends octave

      - name: Install package
        run: pip install -e ".[dev]" tifffile

      - name: Run Octave worker tests
        run: pytest -v tests/test_workers.py -k octave

  build-windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Catches Windows-only problems (paths like C:/x vs C:\x, Tk behaviour) before building.
      - name: Run tests on Windows
        run: pytest -v

      - name: Build GUI exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name TrackBatch --collect-data trackbatch --collect-all tkinterdnd2
          packaging/trackbatch_entry.py

      - name: Build console exe
        run: >
          pyinstaller --noconfirm --onefile --console
          --name trackbatch-cli --collect-data trackbatch --collect-all tkinterdnd2
          packaging/trackbatch_entry.py

      - name: Smoke test the console exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          .\dist\trackbatch-cli.exe --version
          .\dist\trackbatch-cli.exe params -e utrack -o utrack.json
          .\dist\trackbatch-cli.exe params --from-previous tests\data\previous_trackmate.xml
          New-Item -ItemType Directory -Force smoke | Out-Null
          Set-Content smoke\a.tif "x"
          .\dist\trackbatch-cli.exe run -e trackmate -i smoke -o smoke_out --dry-run
          if (-not (Test-Path smoke_out\_trackbatch\trackmate_batch.py)) { throw "Jython script not bundled" }
          .\dist\trackbatch-cli.exe run -e utrack -i smoke -o smoke_out2 --dry-run
          if (-not (Test-Path smoke_out2\_trackbatch\trackbatch_utrack_batch.m)) { throw "MATLAB script not bundled" }
          # smoke\a.tif is not a real TIFF, so the pre-check must report an error (exit code 1)
          .\dist\trackbatch-cli.exe check -e trackmate -i smoke
          if ($LASTEXITCODE -ne 1) { throw "check should have flagged the invalid TIFF" }
          $global:LASTEXITCODE = 0

      - name: Self-test the GUI exe (opens the window, drag-and-drop library, image reading)
        shell: pwsh
        run: |
          $report = Join-Path $PWD "selftest.json"
          $p = Start-Process -FilePath .\dist\TrackBatch.exe -ArgumentList @("selftest", "--report", $report) -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "GUI self-test timed out" }
          Get-Content $report
          $r = Get-Content $report | ConvertFrom-Json
          if (-not $r.ok) { throw "GUI self-test failed" }

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: TrackBatch-windows-${{ github.sha }}
          path: |
            dist/TrackBatch.exe
            dist/trackbatch-cli.exe
            README.md
          if-no-files-found: error

  release:
    # Publishes a GitHub Release with the exe files when either
    #  - a tag like v0.3.0 is pushed, or
    #  - main is pushed with a version in pyproject.toml that has no tag yet
    #    (the release creates the tag v<version> on that commit).
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Decide release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "Release $tag already exists - nothing to do"
              tag=""
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.tag != ''
        with:
          name: TrackBatch-windows-${{ github.sha }}
          path: release

      - name: Zip
        if: steps.tag.outputs.tag != ''
        run: cd release && zip -r ../TrackBatch-${{ steps.tag.outputs.tag }}-windows.zip .

      - uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.tag != ''
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: TrackBatch ${{ steps.tag.outputs.tag }}
          files: TrackBatch-${{ steps.tag.outputs.tag }}-windows.zip
          generate_release_notes: true
