[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trackbatch"
version = "0.1.0"
description = "Batch runner for TrackMate (Fiji) and u-track (MATLAB) particle tracking"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pyinstaller>=6"]

[project.scripts]
trackbatch = "trackbatch.cli:main"

[project.gui-scripts]
trackbatch-gui = "trackbatch.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trackbatch = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
